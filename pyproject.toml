[tool.poetry]
name = "sargus-dns"
version = "0.0.1"
description = "DNS server for local networks, which forward DNS if it does not find a local server"
authors = ["Angus Robinson <angus@sargus.net>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.13.0"
loguru = "^0.7.3"
snoop = "^0.6.0"
dnspython = "^2.6.1"
pygments = "2.20.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
